name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # No Windows row: jolt's fiber poller and ring-chez-adapter's server are
        # POSIX-only (jolt-lang/jolt#1107), so the web server can't run there yet.
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # sqlite3, libxml2 and OpenSSL are loaded at runtime; the runners have them.
      # Latest jolt by default; the JOLT_PIN repository variable pins one.
      - name: Resolve jolt version
        env:
          GH_TOKEN: ${{ github.token }}
          JOLT_PIN: ${{ vars.JOLT_PIN }}
        run: |
          if [ -n "$JOLT_PIN" ]; then
            ver="$JOLT_PIN"
            echo "jolt: pinned to $ver"
          else
            ver=$(gh api repos/jolt-lang/jolt/releases/latest --jq .tag_name)
            [ -n "$ver" ] && [ "$ver" != "null" ] || { echo "could not resolve latest jolt"; exit 1; }
            echo "jolt: latest release is $ver"
          fi
          echo "JOLT_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install jolt
        run: ci/install-jolt.sh "${JOLT_VERSION}" "${{ matrix.target }}"

      - name: Cache git deps
        uses: actions/cache@v4
        with:
          path: ~/.jolt/gitlibs
          key: gitlibs-${{ matrix.target }}-${{ hashFiles('deps.edn') }}

      - name: Test
        run: jolt -M:test
